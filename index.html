<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Photo Viewer</title>
  <!-- Import the stereo-img web component for WebXR viewing -->
  <script type="module" src="https://unpkg.com/stereo-img"></script>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <h1>3D Photo Viewer</h1>
    
    <div class="file-picker-container">
      <label for="folderPicker">Select Folder:</label>
      <!-- webkitdirectory allows users to pick a local folder containing all their sets -->
      <input type="file" id="folderPicker" webkitdirectory directory multiple accept="image/*">
    </div>

    <label for="library-select">Library:</label>
    <select id="library-select" disabled>
      <option value="">Load a folder first...</option>
    </select>
  </header>

  <main>
    <p id="empty-state">Select a local folder containing your images to begin.<br>Images will be grouped into libraries and sets based on their folder structure.</p>

    <!-- The WebXR viewer element -->
    <stereo-img id="viewer" type="pair" hidden></stereo-img>

    <div id="controls" hidden>
      <div class="control-row">
        <button id="prev-set" title="Switch to the previous set of photos">&#9664; Set</button>
        <button id="shift-back" title="Move both photos back one">&#9664; Shift</button>
        <button id="contract" title="Narrow the gap between photos">&minus; Contract</button>
        <button id="expand" title="Widen the gap between photos">+ Expand</button>
        <button id="shift-forward" title="Move both photos forward one">Shift &#9654;</button>
        <button id="next-set" title="Switch to the next set of photos">Set &#9654;</button>
      </div>
      <p id="status"></p>
    </div>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
